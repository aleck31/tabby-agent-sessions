name: Release

on:
  push:
    tags: ['v*']

permissions:
  id-token: write
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - run: npm install -g npm@latest
      - run: npm ci
      # Catches template errors webpack can't see; a broken pane would still build.
      - run: npm run check
      - run: npm run build

      # Stages for review instead of publishing; approve with 2FA to go live.
      # No NODE_AUTH_TOKEN: npm falls back to token auth if it is set, disabling OIDC.
      - run: npm stage publish

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
