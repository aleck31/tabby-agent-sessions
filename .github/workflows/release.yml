name: Release

on:
  push:
    tags: ['v*']

permissions:
  id-token: write
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - run: npm install -g npm@latest
      - run: npm ci
      # Catches template errors webpack can't see; a broken pane would still build.
      - run: npm run check
      - run: npm run build

      # No --provenance: npm rejects it outright for a private source repo (422). Add it back
      # when this repo goes public; until then npm skips attestation on its own.
      # No NODE_AUTH_TOKEN: npm falls back to token auth if it is set, disabling OIDC.
      - run: npm publish --access public

      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
